name: Development Summary

on:
  schedule:
    - cron: '59 23 * * *'  # 11:59 PM UTC every night
  workflow_dispatch:  # Allows manual trigger

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Create summary and send to Notion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          node - <<'EOF'
          const https = require('https');

          const GITHUB_TOKEN = process.env.GITHUB_TOKEN;
          const NOTION_TOKEN = process.env.NOTION_TOKEN;
          const NOTION_DATABASE_ID = process.env.NOTION_DATABASE_ID;
          const REPO = 'your-org/acme-api';

          // Calculate date from 3 days ago
          const threeDaysAgo = new Date();
          threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);
          const dateString = threeDaysAgo.toISOString().split('T')[0];

          function fetchGitHub(path) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'api.github.com',
                path: path,
                method: 'GET',
                headers: {
                  'Authorization': `token ${GITHUB_TOKEN}`,
                  'User-Agent': 'GitHub-Action',
                  'Accept': 'application/vnd.github+json'
                }
              };

              https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch (e) { reject(e); }
                });
              }).on('error', reject).end();
            });
          }

          // Notion rich_text blocks are capped at 2000 chars each
          function toRichTextBlocks(text) {
            const chunks = [];
            for (let i = 0; i < text.length; i += 2000) {
              chunks.push({ text: { content: text.slice(i, i + 2000) } });
            }
            return chunks;
          }

          function sendToNotion(summary) {
            return new Promise((resolve, reject) => {
              const payload = JSON.stringify({
                parent: { database_id: NOTION_DATABASE_ID },
                properties: {
                  "Summary": {
                    title: [{ text: { content: `Development Summary - ${new Date().toLocaleDateString('en-CA')}` } }]
                  },
                  "Date": { date: { start: new Date().toISOString().split('T')[0] } },
                  "Content": { rich_text: toRichTextBlocks(summary) },
                  "Repository": { rich_text: [{ text: { content: 'acme-api' } }] },
                  "Period": { rich_text: [{ text: { content: 'Last 3 Days' } }] }
                }
              });

              const options = {
                hostname: 'api.notion.com',
                path: '/v1/pages',
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${NOTION_TOKEN}`,
                  'Notion-Version': '2022-06-28',
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload)
                }
              };

              https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 400) {
                    reject(new Error(`Notion API error ${res.statusCode}: ${data}`));
                  } else {
                    resolve(data);
                  }
                });
              }).on('error', reject).end(payload);
            });
          }

          async function main() {
            try {
              console.log('Fetching PRs from last 3 days...');
              const prs = await fetchGitHub(
                `/search/issues?q=repo:${REPO}+is:pr+updated:>=${dateString}&sort=updated&per_page=25`
              );
              console.log(`Found ${prs.items ? prs.items.length : 0} PRs`);

              console.log('Fetching commits from last 3 days...');
              const commits = await fetchGitHub(
                `/repos/${REPO}/commits?since=${threeDaysAgo.toISOString()}&per_page=25`
              );
              console.log(`Found ${Array.isArray(commits) ? commits.length : 0} commits`);

              let summary = `## Development Summary - Last 3 Days\n\n`;
              summary += `**Repository:** acme-api\n`;
              summary += `**Generated:** ${new Date().toLocaleDateString('en-CA')}\n\n`;

              // Pull Requests section
              if (prs.items && prs.items.length > 0) {
                summary += `### Pull Requests (${prs.items.length})\n\n`;
                prs.items.forEach(pr => {
                  const status = pr.state === 'closed' ? '✅ Merged/Closed' : '🔄 Open';
                  const mergedAt = pr.pull_request && pr.pull_request.merged_at
                    ? new Date(pr.pull_request.merged_at).toLocaleDateString('en-CA')
                    : null;
                  summary += `- **${pr.title}** ${status}\n`;
                  summary += `  Updated: ${new Date(pr.updated_at).toLocaleDateString('en-CA')}`;
                  if (mergedAt) summary += ` | Merged: ${mergedAt}`;
                  summary += `\n\n`;
                });
              } else {
                summary += `### Pull Requests\n\nNo pull requests updated in the last 3 days.\n\n`;
              }

              // Commits section
              if (Array.isArray(commits) && commits.length > 0) {
                summary += `### Commits (${commits.length})\n\n`;
                commits.forEach(c => {
                  const msg = c.commit.message.split('\n')[0];
                  const author = c.commit.author.name;
                  const date = new Date(c.commit.author.date).toLocaleDateString('en-CA');
                  summary += `- **${msg}** — ${author} (${date})\n`;
                });
                summary += '\n';
              } else {
                summary += `### Commits\n\nNo commits in the last 3 days.\n\n`;
              }

              console.log('Summary generated. Sending to Notion...');
              await sendToNotion(summary);
              console.log('✅ Summary sent to Notion successfully!');

            } catch (error) {
              console.error('Error:', error.message || error);
              process.exit(1);
            }
          }

          main();
          EOF
