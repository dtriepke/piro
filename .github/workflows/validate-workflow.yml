name: Validate workflow artifacts

on:
  pull_request:
    paths:
      - 'piro/**'
      - 'piro/tooling/validate-workflow.ts'
      - 'piro/tooling/validate-safety-contract.ts'
      - 'piro/tooling/workflow-progress.ts'
      - 'piro/tooling/workflow-dashboard.ts'
      - 'piro/tooling/workflow-dashboard/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate piro/ artifact chain
        run: npm run validate:workflow

      - name: Validate safety, consent and authority contract artifacts
        run: npm run validate:safety
